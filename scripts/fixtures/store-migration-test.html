<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>存档迁移回归测试</title>
    <style>
      html,
      body {
        margin: 0;
        width: 400px;
        height: 340px;
        overflow: hidden;
        background: #0d1520;
      }
    </style>
  </head>
  <body>
    <!--
      「代码默认值 vs 用户显式选择」的回归测试（详见 docs/architecture.md §6.3）。

      症状：writeStore() 会把 DEFAULTS 的每一项都写盘，于是用户只要开过一次菜单，
      当时的默认画风就被钉死在 localStorage 里 —— 之后改代码默认值对已有存档完全无效，
      表现是"改了默认画风，重启后还是旧角色"。

      本页造一份**旧版存档**，里面同时踩了两个历史包袱：
        · style: "polished" —— 那套手画 SVG 早就删了（连 svg 这个取值都删了）；
        · 没有 stylePinned 标记 —— 说明这个 style 是"当时的默认值"，不是用户选的。
      另外带 size=1.3 / volume=0.25，用来验证**迁移只动画风、别的字段原样保留**。

      期望：
        1. 画风被迁移掉 —— 既不是 "polished"、也不是 "svg"（那个取值已失去意义），
           而是注入清单里真实存在的那一套（"art"）；
        2. size / volume 原样保留；
        3. 角色真的渲染出来了（用注入的清单 + 已入库的自检图，所以任何克隆里都能跑）。

      ⚠️ 为什么必须注入清单：迁移后画风的取值只认"清单里存在的原画集键"，
      没有清单时正确行为是"什么都不画"，那就验证不出"迁移到了正确的键"。
      用的是 scripts/fixtures/art-4x3.png（我们自己画的透明底小图，可入库）。
      由 scripts/selftest-desktop.mjs 在**独立 --user-data-dir** 下运行，不会碰真实存档。
    -->
    <script>
      localStorage.setItem(
        "dsh-handsome-fish:v1",
        JSON.stringify({ style: "polished", size: 1.3, volume: 0.25 }),
      );
      /* 清单走"旧格式单套"（键名 art），基准路径相对本页（scripts/fixtures/）。
         ⚠️ 旧格式也要带上 states —— 客户端的入口判定是 `sets || states`，
         只有 default 的清单会被当成"没清单"而忽略（这条踩过一次）。 */
      window.__HANDSOME_FISH_ART_BASE__ = "./";
      window.__HANDSOME_FISH_ART_MANIFEST__ = {
        default: "art-4x3.png",
        states: { click: "art-alt-4x3.png" },
      };
      window.__PREVIEW_CTX__ = {
        on() {
          return () => {};
        },
        inject(_n, cb) {
          void cb;
          return () => {};
        },
      };
      window.__ModuleLoader__ = {
        load(entry) {
          try {
            const m = entry.factory(function () {
              throw new Error("no platform module");
            });
            m.apply(window.__PREVIEW_CTX__);
          } catch (e) {
            console.log("HF-MIG FAIL apply: " + e.message);
          }
        },
      };
    </script>
    <script src="../../lib/client.js"></script>
    <script>
      setTimeout(() => {
        const api = window.__HANDSOME_FISH__;
        const style = api ? api.state.style : "?";
        const size = api ? api.state.size : "?";
        const volume = api ? api.state.volume : "?";
        const img = document.querySelector(".hf-img");
        const src = img ? img.getAttribute("src") : "";
        /* 有清单时角色必须是**图片**；顺带把"线稿又回来了"这件事也挡住 */
        const noLineArt = !document.querySelector(".hf-svg");
        console.log(
          `HF-MIG style=${style} size=${size} volume=${volume} art=${src || "-"} noLineArt=${noLineArt}`,
        );
        console.log(
          "HF-MIG verdict=" +
            (style === "art" &&
            size === 1.3 &&
            volume === 0.25 &&
            /art-4x3\.png$/.test(src) &&
            noLineArt
              ? "PASS"
              : "FAIL"),
        );
      }, 600);
    </script>
  </body>
</html>
