<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>handsomeFish · 桌面载体</title>
    <style>
      /*
       * 真·桌面级载体的关键差异：整页必须完全透明。
       * 外壳（Electron / WebView2）会把整个工作区铺一块透明窗口盖在桌面上，
       * 角色用 CSS 在窗口内自由移动 —— 所以「整个桌面四处放」是靠窗口透明 +
       * 角色在窗口内定位实现的，不需要让窗口本身跟着跑。
       * 这一层只要有底色，就会变成一块盖住整个桌面的板子。
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        /* 桌面宠物不该被选中、不该有滚动条、不该触发浏览器手势缩放 */
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      /* 自检输出（只在 ?selftest=1 时插入），方便用 --dump-dom 机读 */
      #hf-selftest {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 2147483647;
        margin: 0;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.88);
        color: #9fe8ff;
        font: 12px/1.6 Consolas, monospace;
        border: 1px solid rgba(159, 232, 255, 0.4);
        border-radius: 8px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <!--
      ============================================================================
      handsomeFish 的 OS 级载体页
      ----------------------------------------------------------------------------
      与 DSH 插件载体（lib/client.js 由宿主的 /plugins 路由提供）的区别只有两点：
        1. 这里自己提供一个最小的 __ModuleLoader__ 与 ctx 桩，把 factory 直接物化；
        2. 这里把 __HANDSOME_FISH_BRIDGE__ 接到外壳上，用于点击穿透与退出。
      角色本体一行都不改 —— lib/client.js 是两个载体唯一的共同真相来源。
      ============================================================================
    -->
    <script>
      /* ---------------------------------------------------------------------
         1. 桥：把「鼠标在不在角色上」报给外壳
            · Electron  → preload 暴露 window.handsomeFishBridge
            · WebView2  → window.chrome.webview.postMessage
            · 浏览器调试 → 打到 console
         外壳据此决定放不放行鼠标（Electron 的 setIgnoreMouseEvents /
         Win32 的 WS_EX_TRANSPARENT），实现「角色可点、其余区域穿透」。
         --------------------------------------------------------------------- */
      window.__HF_BRIDGE_LOG__ = [];

      function sendToShell(msg) {
        try {
          if (typeof window.handsomeFishBridge === "function") {
            window.handsomeFishBridge(msg); /* Electron preload */
          } else if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
            window.chrome.webview.postMessage(msg); /* WebView2 */
          } else {
            window.__HF_BRIDGE_LOG__.push(msg);
            console.log("[handsomeFish bridge]", JSON.stringify(msg));
          }
        } catch (error) {
          console.error("[handsomeFish] bridge failed:", error);
        }
      }

      window.__HANDSOME_FISH_BRIDGE__ = sendToShell;

      /* ---------------------------------------------------------------------
         1.5 状态路由的绝对地址
             桌面窗是 file:// 源，相对路径取不到 DSH 的 HTTP 路由；外壳（main.js）
             从 DSH_WEB_URL 或 ~/.dsh/mobile-access/setup.json 解析出 host，经
             preload 的 handsomeFishConfig 传进来。拿不到就不覆盖 —— 客户端会退回
             相对路径，只是没有结束音，其余功能不受影响。
         --------------------------------------------------------------------- */
      try {
        const cfg = window.handsomeFishConfig;
        if (cfg && typeof cfg.eventsUrl === "string" && cfg.eventsUrl) {
          window.__HANDSOME_FISH_EVENTS_URL__ = cfg.eventsUrl;
        }
      } catch (error) {
        console.warn("[handsomeFish] 读取 handsomeFishConfig 失败:", error);
      }

      /* 调试用出口：?events=<绝对地址>（仅在页面本身是 http(s) 源时才有用） */
      try {
        const q = new URLSearchParams(location.search).get("events");
        if (q) window.__HANDSOME_FISH_EVENTS_URL__ = q;
      } catch (error) {
        /* ignore */
      }

      /* ---------------------------------------------------------------------
         1.6 「一轮对话结束」的来源：外壳 IPC
             实测：Chromium 禁止 file:// 页面 fetch http://（得到 Failed to fetch），
             所以桌面窗里前端**不能**自己轮询 DSH —— 轮询由外壳在 Node 侧做，
             这里只负责把推来的事件翻译成客户端认识的 window 事件。
             同时关掉客户端自己的轮询，避免白试三次。
         --------------------------------------------------------------------- */
      window.__HANDSOME_FISH_NO_POLL__ = true;

      try {
        if (window.handsomeFishTurns && typeof window.handsomeFishTurns.subscribe === "function") {
          window.handsomeFishTurns.subscribe((payload) => {
            console.log("[handsomeFish] 收到轮次事件", JSON.stringify(payload || {}));
            window.dispatchEvent(new CustomEvent("handsome-fish:turn-end", { detail: payload || null }));          });
        }
      } catch (error) {
        console.warn("[handsomeFish] 订阅轮次事件失败:", error);
      }

      /* 「一轮进行中」→ 翻译成客户端认识的 window 事件（桌面窗没有键盘焦点，
         收不到键盘事件，所以"他在认真工作"在这里只能由轮次状态体现） */
      try {
        if (window.handsomeFishBusy && typeof window.handsomeFishBusy.subscribe === "function") {
          window.handsomeFishBusy.subscribe((busy) => {
            window.dispatchEvent(
              new CustomEvent("handsome-fish:busy", { detail: { busy: busy === true } }),
            );
          });
        }
      } catch (error) {
        console.warn("[handsomeFish] 订阅忙碌状态失败:", error);
      }

      /* ---------------------------------------------------------------------
         1.7 角色图：默认**不**覆盖
             内置的程序化 SVG 小蓝才是默认形象，和 DSH 插件里看到的是同一个角色。
             只有显式给 ?art=<路径> 时才用图片替换（便于临时试验素材）。
             常规换角色走右键菜单的「换个角色图」，存在 localStorage 里、优先级最高。
             ⚠️ 别在这里写死一张图：那会把桌面壳的角色换成别的角色，
                与插件里的形象不一致（assets/ 只是本地试验品，不入库；
                仓库自带的自检素材是 ../scripts/fixtures/art-4x3.png）。
         --------------------------------------------------------------------- */
      try {
        const q = new URLSearchParams(location.search).get("art");
        if (q) window.__HANDSOME_FISH_DEFAULT_ART__ = q;
      } catch (error) {
        /* ignore */
      }

      /* 画风：?style=art|simple —— 只是"初始默认"，用户在菜单里改过就以用户为准 */
      try {
        const st = new URLSearchParams(location.search).get("style");
        if (st === "art" || st === "simple") window.__HANDSOME_FISH_STYLE__ = st;
      } catch (error) {
        /* ignore */
      }

      /* 作者原画：清单由 preload 用 Node 读出并注入（file:// 下 fetch 本地 json 会被拦），
         基准路径相对本页（desktop/）。拿不到就退回内置 SVG。 */
      try {
        const art = window.handsomeFishArt;
        if (art && typeof art.base === "string") window.__HANDSOME_FISH_ART_BASE__ = art.base;
        if (art && art.manifest) window.__HANDSOME_FISH_ART_MANIFEST__ = art.manifest;
      } catch (error) {
        /* ignore */
      }

      /* 注意：原先这里支持 ?svg=1 强制用内置线稿 SVG（自检要一条确定性路径）。
         内置线稿已按用户要求删除，角色只剩图片这一条路，所以这个开关也一起去掉了 ——
         自检改成用 ?art= 指一张**已入库的**自检图（scripts/fixtures/art-4x3.png）。 */

      /* ---------------------------------------------------------------------
         2. 最小宿主桩：和 DSH 宿主一样，把 factory 物化后调用 apply(ctx)
         --------------------------------------------------------------------- */
      window.__PREVIEW_CTX__ = {
        on() {
          return () => {};
        },
        inject(_names, cb) {
          void cb;
          return () => {};
        },
      };

      window.__ModuleLoader__ = {
        load(entry) {
          try {
            const mod = entry.factory(function require(name) {
              throw new Error("desktop carrier: no platform module available: " + name);
            });
            mod.apply(window.__PREVIEW_CTX__);
            window.__HF_LOADED__ = entry.id;
          } catch (error) {
            console.error("[handsomeFish] load failed:", error);
            document.title = "加载失败：" + error.message;
          }
        },
      };
    </script>

    <!-- 角色本体：与 DSH 插件用的是同一个文件 -->
    <script src="../lib/client.js"></script>

    <script>
      /* ---------------------------------------------------------------------
         3. ?selftest=1：机读自检
            验证三件事：桥收到 ready、鼠标进角色会报 hover、桌面模式下多出退出按钮。
            结果写进 #hf-selftest，方便用 headless Chrome 的 --dump-dom 直接抓文本。
         --------------------------------------------------------------------- */
      if (location.search.includes("selftest")) {
        /* 用 async IIFE：因为要 await 图片解码 —— 素材图是异步加载的，
           不等它就会把 "还在加载" 误报成 "0x0 加载失败"。 */
        void (async () => {
        const lines = [];
        let pass = 0;
        let fail = 0;
        const ok = (name, cond, extra) => {
          if (cond) pass++;
          else fail++;
          lines.push((cond ? "PASS  " : "FAIL  ") + name + (extra ? "  [" + extra + "]" : ""));
        };

        const api = window.__HANDSOME_FISH__;
        ok("client.js 已物化并 apply", !!api && window.__HF_LOADED__ === "dsh-handsome-fish", window.__HF_LOADED__);

        const ready = window.__HF_BRIDGE_LOG__.find((m) => m.type === "ready");
        ok("桥收到 ready", !!ready, ready ? JSON.stringify(ready) : "无");
        ok("桥判定载体为 desktop", !!ready && ready.carrier === "desktop");

        const fish = document.querySelector(".dsh-handsome-fish-fish");
        ok("角色 DOM 存在", !!fish);

        /* 角色渲染：**只有图片这一条路**（内置线稿已删除）。
           自检必须证明两件事：
             ① 图片真的解码出来了 ——「没报错」不算证据；
             ② 页面上**没有任何内置线稿的痕迹**（.hf-svg / 部件类名），
                否则说明代码里那套东西又回来了。 */
        const artParam = new URLSearchParams(location.search).get("art");
        const artImg = document.querySelector(".hf-img");
        const artWrap = document.querySelector(".hf-art");
        ok(
          "没有内置线稿了（页面里不存在 .hf-svg）",
          !document.querySelector(".hf-svg"),
          document.querySelector(".hf-svg") ? "还有 .hf-svg！" : "已彻底移除",
        );
        if (artParam) {
          if (!artImg) {
            ok("?art= 指定的角色图已接入", false, `给了 ?art= 但页面里没有 .hf-img`);
          } else {
            try {
              await artImg.decode();
              ok(
                "?art= 指定的角色图已解码",
                artImg.naturalWidth > 0,
                `${artImg.getAttribute("src")} → 实际 ${artImg.naturalWidth}x${artImg.naturalHeight}`,
              );
            } catch (error) {
              ok("?art= 指定的角色图已解码", false, `${artParam} 解码失败：${error.message}`);
            }
          }
        } else {
          /* 不带 ?art= 时角色来自 assets/ 的作者原画；全新克隆里 assets/ 是空的，
             此时**什么都不画**才是正确行为（不能退回手画线稿） */
          ok(
            "角色已渲染（只有图片这一条路）",
            !!artImg || !artWrap,
            artImg ? "作者原画/自定义图" : "没有素材 → 不画（正确）",
          );
        }

        /* 图片角色也要"活着"：图片没有部件级动画，浮动/点头/挤压必须挂在 .hf-art 上，
           否则换成作者原画后角色会完全静止（只剩拖动倾斜） */
        const artAnim = artWrap ? getComputedStyle(artWrap).animationName : "none";
        ok("图片角色仍在浮动（.hf-art 动画已生效）", !!artWrap && artAnim !== "none", artAnim);

        /* --- 画风 / 原画链路 ---
           内置线稿（那套手画 SVG：两种画风标记 + 六个可动部件 + 7 种表情）已按用户要求
           删除，所以这一段改验**图片这一条链路还活着**：
             · 换画风 / 清掉自定义图之后，角色仍然经 .hf-art 渲染，动画没断；
             · 调试 API 里不再暴露线稿那套（face / 表情）；
             · 下拉里的每一档都是原画集，没有 `svg` 这种已经不存在的取值。
           注意本次自检是带 ?art= 跑的（角色是 <img>），所以先把自定义图清掉。 */
        if (api && typeof api.setArt === "function") {
          const prevStyleBeforeStyleChecks = api.state.style;
          api.setArt(""); /* 清掉 ?art= 的自定义图，回到"按画风走清单原画" */
          if (artParam) {
            /* 清了自定义图后是否还有角色，取决于本地 assets/ 有没有清单：
               有清单 → 落在清单第一套原画上（应该仍然有图）
               没有清单 → 什么都不画（这是正确行为，绝不能再退回手画线稿） */
            const imgAfterReset = document.querySelector(".hf-img");
            ok(
              "清掉自定义图之后：有素材就用原画，没素材就什么都不画（不退回线稿）",
              !!imgAfterReset || !document.querySelector(".hf-svg"),
              imgAfterReset ? "落回清单原画：" + imgAfterReset.getAttribute("src") : "本机无素材 → 不画（正确）",
            );
          }
          /* ⚠️ 这里必须**重新查一次** .hf-art：上面那个 artWrap 是入口状态的快照，
             setArt("") 之后 DOM 可能已经被重建过了。 */
          const wrap2 = document.querySelector(".hf-art");
          const anim2 = wrap2 ? getComputedStyle(wrap2).animationName : "none";
          ok(
            "换画风/换图之后仍挂在 .hf-art 上，动画没断",
            !wrap2 || anim2 !== "none",
            wrap2 ? anim2 : "没有图片（本机无素材时的正常状态）",
          );
          api.state.style = prevStyleBeforeStyleChecks;
          api.redraw(); /* 复原，后面的检查按入口时的画风继续 */
        }

        /* --- 「没有素材」时到底画什么 -------------------------------------------
           用户的要求（docs/todo.md 第 1 项第 1 点）：没素材时**什么都不画** +
           用气泡提示一次，**绝不能变回我画的东西**。
           这里必须用真实链路验：强制把画风设成一个清单里不存在的键（等价于"没有素材"），
           然后 redraw —— 容器必须是**空的**（连空白 SVG 都不许有，更不许有 <svg>）。 */
        if (api) {
          const savedStyle = api.state.style;
          api.setArt(""); /* 清掉 ?art= 的自定义图，否则它优先级最高、走不到"没素材"分支 */
          api.state.style = "__no_such_art_set__";
          const container = document.querySelector(".dsh-handsome-fish-fish");
          api.redraw();
          const html = container ? container.innerHTML : "?";
          ok(
            "没有素材时什么都不画（不退回任何内置图形）",
            !!container && html === "",
            html === "" ? "容器为空（正确）" : "居然画了东西：" + html.slice(0, 60),
          );
          ok(
            "没有素材时也没有 .hf-svg / .hf-art 残留",
            !document.querySelector(".hf-svg") && !document.querySelector(".hf-art"),
            document.querySelector(".hf-svg") ? "还有 .hf-svg！" : "干净",
          );
          /* 恢复：把画风与自定义图放回入口时的样子 */
          api.state.style = savedStyle;
          api.setArt(artParam || "");
        }

        /* --- 线稿那套调试 API 必须已经不在了 --- */        if (api) {
          ok(
            "调试 API 里没有线稿那套（api.face 已移除）",
            typeof api.face !== "function",
            typeof api.face === "function" ? "api.face 还在！" : "api.face 已移除",
          );
        }

        /* 气泡的位置：用户明确要求"对话框在旁边" —— 它必须落在角色**水平外侧**，
           而不是压在角色身上（原先贴在角色正上方，会盖住脑袋）。
           外加一条形状断言：绝对定位 + 侧边锚定容易让可用宽度算成负数、文字一行一个字
           缩成竖条（真踩过）。所以这里放上真台词，量它是不是**横向**的。 */
        {
          const probe = document.querySelector(".dsh-handsome-fish-say");
          const body = document.querySelector(".dsh-handsome-fish-fish");
          if (probe && body) {
            probe.textContent = "自检用的台词，看看气泡形状对不对";
            probe.classList.add("is-on"); /* 强制显示后再量 */
            const s = probe.getBoundingClientRect();
            const f = body.getBoundingClientRect();
            probe.classList.remove("is-on");
            const beside = s.right <= f.left + 2 || s.left >= f.right - 2;
            ok(
              "台词气泡贴在角色侧边（不压在角色上）",
              beside,
              `气泡 ${Math.round(s.left)}–${Math.round(s.right)} vs 角色 ${Math.round(f.left)}–${Math.round(f.right)}`,
            );
            ok(
              "台词气泡是横向的（没有缩成竖条）",
              s.width >= 120 && s.width > s.height,
              `气泡 ${Math.round(s.width)}×${Math.round(s.height)}`,
            );
          }
        }

        /* --- 四个开关的语义必须一致：勾上＝该功能开启 ---
           用户报过：「音效」勾上反而是关掉声音 —— 因为它背后存的是 muted（静音），
           与其他三个（speech/snap/endSound）的正向语义相反。这条断言就是钉住这个坑。 */
        {
          const expects = { sound: true, speech: true, snap: true, endSound: true };
          const bad = [];
          for (const k of Object.keys(expects)) {
            const box = document.querySelector(`[data-k="${k}"]`);
            if (!box) bad.push(`${k} 没有控件`);
            else if (box.checked !== expects[k]) bad.push(`${k}=${box.checked}(应为${expects[k]})`);
          }
          ok(
            "四个开关都是「勾上＝开启」，且默认全开",
            bad.length === 0,
            bad.length ? bad.join(" ") : "sound / speech / snap / endSound 默认都勾上",
          );
        }

        /* --- 音效风格下拉：四套预设都要真的能选中并改变 state ---
           用户报过「切了没反应」那类问题（控件在、但没接上处理器），
           所以这里必须**由控件本身**驱动：设 el.value + 派发 change，
           再读 api.state.soundStyle 是否跟着走。
           ⚠️ change 必须 bubbles:true —— 监听器挂在 menu（父元素）上，
           不冒泡就根本到不了 onMenuInput，表现为"改了 state 不动"。
           （踩过：不冒泡时这个断言实测会失败，而手动点菜单是好的。） */
        {
          const sel = document.querySelector('[data-k="soundStyle"]');
          ok("设置菜单里有音效风格下拉", !!sel);
          if (sel) {
            const values = Array.from(sel.options).map((o) => o.value);
            ok(
              "音效风格下拉有四套预设",
              ["default", "soft", "retro", "mech"].every((v) => values.includes(v)),
              values.join(","),
            );

            const bad = [];
            for (const v of values) {
              sel.value = v;
              sel.dispatchEvent(new Event("change", { bubbles: true }));
              if (api.state.soundStyle !== v) bad.push(`${v}→state=${api.state.soundStyle}`);
            }
            ok(
              "逐个切音效风格：state.soundStyle 跟着走（含切风格即试听那条分支）",
              bad.length === 0,
              bad.length ? bad.join(" ") : values.join(" → "),
            );

            /* 复原成入口时的值，别把状态留给后面的断言 */
            sel.value = "default";
            sel.dispatchEvent(new Event("change", { bubbles: true }));
          }
        }

        if (fish) {
          const before = window.__HF_BRIDGE_LOG__.length;
          fish.dispatchEvent(new PointerEvent("pointerenter", { bubbles: false }));
          const hoverOn = window.__HF_BRIDGE_LOG__.slice(before).find((m) => m.type === "hover");
          ok("鼠标进入角色 → 桥报 hover:true", !!hoverOn && hoverOn.on === true, JSON.stringify(hoverOn || null));

          fish.dispatchEvent(new PointerEvent("pointerleave", { bubbles: false }));
          const hoverOff = window.__HF_BRIDGE_LOG__.slice(before).find((m) => m.type === "hover" && m.on === false);
          ok("鼠标离开角色 → 桥报 hover:false", !!hoverOff);
        }

        const say = document.querySelector(".dsh-handsome-fish-say");
        ok(
          "台词气泡隐藏时不抢鼠标",
          !!say && getComputedStyle(say).pointerEvents === "none",
          say ? getComputedStyle(say).pointerEvents : "无",
        );

        /* 同一个元素的相反状态：显示时必须能接收点击（点一下收起），否则气泡点不掉 */
        if (api && typeof api.say === "function") api.say("自检用的台词");
        const sayOn = document.querySelector(".dsh-handsome-fish-say");
        ok(
          "台词气泡显示时可接收点击",
          !!sayOn && sayOn.classList.contains("is-on") && getComputedStyle(sayOn).pointerEvents === "auto",
          sayOn
            ? "is-on=" + sayOn.classList.contains("is-on") + " pointer-events=" + getComputedStyle(sayOn).pointerEvents
            : "无",
        );

        const quit = document.querySelector('[data-act="quit"]');
        ok("桌面模式下菜单多出「退出挂件」", !!quit);

        const layer = document.getElementById("dsh-handsome-fish");
        ok("挂件层已注入", !!layer);
        ok(
          "页面保持透明（不盖住桌面）",
          getComputedStyle(document.body).backgroundColor === "rgba(0, 0, 0, 0)",
          getComputedStyle(document.body).backgroundColor,
        );

        const stage = document.querySelector(".dsh-handsome-fish-stage");
        ok("角色已定位在视口内", !!stage && parseFloat(stage.style.left) >= 0 && parseFloat(stage.style.top) >= 0,
          stage ? stage.style.left + "," + stage.style.top : "无");

        /* --- 外壳推入「一轮结束」这条链路：派发 window 事件 → 角色应当做出反应 --- */
        const sayProbe = document.querySelector(".dsh-handsome-fish-say");
        if (sayProbe) {
          sayProbe.classList.remove("is-on");
          sayProbe.textContent = "";
          window.dispatchEvent(new CustomEvent("handsome-fish:turn-end"));
          ok(
            "外壳推入轮次事件 → 角色做出反应",            sayProbe.classList.contains("is-on") && sayProbe.textContent.length > 0,
            sayProbe.textContent || "无反应",
          );
        }

        /* --- 菜单里的画风下拉必须真的能换角色（放在最后：切画风会顺带说一句话，
               那会让前面「气泡隐藏时不抢鼠标」的断言看到开着的气泡）---
           上面那些断言是**直接改 state**，走不到「select 的 change 事件 → onMenuInput →
           renderCharacter」这条真实链路。用户报过「切换画风之后并没有发生改变」，
           所以这条必须由控件本身驱动。 */
        const styleSel = document.querySelector('[data-k="style"]');
        ok("设置菜单里有画风下拉", !!styleSel);
        if (styleSel) {
          const prevStyle = api.state.style;
          /* 选项是按清单动态生成的（每档＝一套作者原画），所以这里遍历真实选项，
             而不是写死某几个值 —— 清单换了这套测试也不用改 */
          const values = Array.from(styleSel.options)
            .map((o) => o.value)
            .filter((v) => v !== "");
          ok(
            "画风下拉里没有「内置线稿」这个已经不存在的取值",
            !values.includes("svg"),
            values.length ? values.join(",") : "没有任何原画集（本页无素材清单时的正常状态）",
          );

          /* 逐个切：state 必须跟着走，且角色要经 .hf-art 渲染出来（不能"切了没反应"） */
          const bad = [];
          for (const v of values) {
            styleSel.value = v;
            styleSel.dispatchEvent(new Event("change", { bubbles: true }));
            const got = document.querySelector(".hf-img");
            if (api.state.style !== v || !got) bad.push(`${v}→state=${api.state.style},渲染=${got ? "有" : "无"}`);
          }
          ok(
            "逐个切画风：state 与渲染都跟着走（有的必须是 .hf-art 里的图）",
            bad.length === 0,
            bad.length ? bad.join(" ") : values.length ? values.join(" → ") : "没有可选原画集，跳过",
          );

          /* 复原成入口时的画风，别把状态留给下一个断言 */
          styleSel.value = prevStyle;
          styleSel.dispatchEvent(new Event("change", { bubbles: true }));
        }

        lines.push("");

        /* 信息性：轮次事件从哪来（桌面载体应为 IPC；纯浏览器自检时没有外壳） */
        lines.push(
          "INFO  轮次事件源：" +
            (window.handsomeFishTurns && typeof window.handsomeFishTurns.subscribe === "function"
              ? "外壳 IPC（轮询在 Node 侧）"
              : "无（纯浏览器环境，没有外壳）"),
        );
        lines.push("INFO  前端自轮询：" + (window.__HANDSOME_FISH_NO_POLL__ ? "已关闭（桌面载体）" : "开着"));

        lines.push("");        lines.push(`viewport ${innerWidth}x${innerHeight}`);
        lines.push(`结果：${pass} 通过 / ${fail} 失败`);
        document.title = fail === 0 ? "SELFTEST-OK" : "SELFTEST-FAIL";

        /* 同时打一行机读汇总：headless 下可以用 --enable-logging=stderr 抓它 */
        console.log("HF-SELFTEST " + (fail === 0 ? "OK" : "FAIL") + " pass=" + pass + " fail=" + fail);
        for (const line of lines) console.log("HF-SELFTEST| " + line);

        const pre = document.createElement("pre");
        pre.id = "hf-selftest";
        pre.textContent = lines.join("\n");
        document.body.appendChild(pre);
        })();
      }
    </script>
  </body>
</html>
